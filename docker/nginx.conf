server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Все статические ресурсы кешируются надолго — URL меняется с каждым деплоем
    location ~* \.(css|js|json|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML не кешируется: содержит актуальные хеши ресурсов
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(git|env|htaccess) { deny all; return 404; }
    location ^~ /scripts/ { deny all; return 404; }
}

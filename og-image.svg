<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#121213"/>

  <!-- Tile grid icon (2x2 + 1) centered at top -->
  <g transform="translate(504, 140)">
    <rect x="0"   y="0"   width="88" height="88" rx="10" fill="#3a3a3c"/>
    <rect x="104" y="0"   width="88" height="88" rx="10" fill="#538d4e"/>
    <rect x="0"   y="104" width="88" height="88" rx="10" fill="#b59f3b"/>
    <rect x="104" y="104" width="88" height="88" rx="10" fill="#3a3a3c"/>
  </g>

  <!-- Title -->
  <text x="600" y="410" text-anchor="middle" font-family="system-ui,sans-serif" font-size="86" font-weight="800" fill="white">Не вордли</text>

  <!-- Subtitle -->
  <text x="600" y="468" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" fill="#818384">Угадай слово, но НЕ угадай</text>

  <!-- URL -->
  <text x="600" y="570" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" fill="#538d4e">dontwordle.ru</text>
</svg>

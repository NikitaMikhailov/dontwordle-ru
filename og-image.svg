<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#121213"/>

  <!-- 2x2 tile grid centered -->
  <g transform="translate(100, 80)">
    <rect x="0"   y="0"   width="88" height="88" rx="10" fill="#3a3a3c"/>
    <rect x="104" y="0"   width="88" height="88" rx="10" fill="#538d4e"/>
    <rect x="0"   y="104" width="88" height="88" rx="10" fill="#b59f3b"/>
    <rect x="104" y="104" width="88" height="88" rx="10" fill="#3a3a3c"/>
  </g>

  <!-- Title -->
  <text x="200" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="white">Не вордли</text>

  <!-- URL -->
